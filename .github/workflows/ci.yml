name: CI

on:
  push:
    branches: [main, develop, "cursor/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: dps
          POSTGRES_PASSWORD: dps
          POSTGRES_DB: daily_payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dps -d daily_payment"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dps:dps@localhost:5432/daily_payment
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: daily-payment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Build
        working-directory: apps/api
        run: npm run build

      - name: Unit tests
        working-directory: apps/api
        run: npm test

      - name: Run migrations
        working-directory: apps/api
        run: npm run migration:run

      - name: E2E tests
        working-directory: apps/api
        run: npm run test:e2e
